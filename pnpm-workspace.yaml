packages:
  - packages/*
  - template

# template depends on "kiln-cms": "^0.5.0" so it can be copied out of this repo as it is.
# Inside the repo that version resolves to packages/kiln-cms.
linkWorkspacePackages: true

allowBuilds:
  esbuild: true
  workerd: true
  sharp: false
  "@parcel/watcher": false

# drizzle-kit still pulls the deprecated @esbuild-kit loader, pinned to esbuild 0.18 (GHSA-67mh-4wv8-2f99).
# It runs with the esbuild drizzle-kit itself uses.
overrides:
  "@esbuild-kit/core-utils>esbuild": "0.25.12"

minimumReleaseAgeExclude:
  - "@tanstack/query-core@5.108.4"
  - "@tanstack/react-query@5.108.4"
  - lucide-react@1.78.0
  - cheese-editor@0.1.0
